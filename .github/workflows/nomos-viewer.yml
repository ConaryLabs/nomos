name: nomos viewer

# The R1-4 lane, extended by R1-5: the authoritative runtime built for the
# browser, the app's own tests, the staged public artifact, the scan over it, the
# headless Chromium run that plays the four-area route to the final escape, and
# the native replay of the session that run produced. RUNTIME.md section 5 R1-4
# requires this lane to exist and to be green and R1-5 requires the identity
# assertion; no target is accepted while it is red or absent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  viewer:
    name: tests, artifact, scan, browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The smoke harness drives Chrome over Node's global WebSocket, which is
      # stable from Node 22 and absent by default in Node 20. Nothing else in
      # the tree pins a Node, and this lane should not depend on the runner
      # image's default.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Record the environment
        run: |
          node --version
          google-chrome --version
          rustc --version

      # The authoritative runtime, before anything that stages or loads it.
      # `build-wasm.sh` also sweeps the linked module and fails closed on a path
      # from the machine that built it, which is where that check is meaningful.
      - name: Build the play runtime for the browser
        run: crates/nomos-play/build-wasm.sh

      # `nomos-play replay` is what the smoke lane shells to compare the
      # browser's session with the native runtime's.
      - name: Build the native play runtime
        run: cargo build --locked -p nomos-play

      # Runs after the wasm build, because `test/runtime.test.mjs` drives the
      # staged binary and skips with a message when it is absent.
      - name: App tests
        run: node --test apps/nomos-viewer/test/*.test.mjs

      - name: The acceptance grep
        # Recorded rather than asserted here: `test/origins.test.mjs` is the
        # mechanical version, which accounts for every occurrence. This prints
        # what a reader running the acceptance line themselves would see.
        run: |
          set -uo pipefail
          if grep -rn "cdn\.jsdelivr\|unpkg" apps/ --include=*.mjs --include=*.html \
              --exclude-dir=test; then
            echo "an external CDN reference survives outside the tests" >&2
            exit 1
          fi
          echo "every external origin named under apps/ and in this workflow:"
          grep -rn "https\?://" apps/ .github/workflows/nomos-viewer.yml \
            --exclude-dir=vendor || true

      - name: Publish the study's artifacts
        run: experiments/executable-gaol/gaol capture

      - name: Stage and scan the public artifact
        run: |
          node apps/nomos-viewer/build.mjs \
            --from target/executable-gaol \
            --wasm target/wasm32-unknown-unknown/wasm/nomos_play.wasm \
            --out apps/nomos-viewer/dist \
            --receipt target/nomos-viewer-build/receipt.json

      # Two builds, one wiped target directory between them, and the same
      # sha256. RUNTIME.md section 7 records the number this proves.
      - name: The runtime is reproducible
        run: |
          set -euo pipefail
          first=$(sha256sum target/wasm32-unknown-unknown/wasm/nomos_play.wasm | cut -d' ' -f1)
          rm -rf target/wasm32-unknown-unknown
          crates/nomos-play/build-wasm.sh
          second=$(sha256sum target/wasm32-unknown-unknown/wasm/nomos_play.wasm | cut -d' ' -f1)
          echo "build 1 $first"
          echo "build 2 $second"
          test "$first" = "$second"

      # The staged runtime and the one just rebuilt must be the same bytes, or
      # the artifact the browser is about to load is not the one measured.
      - name: The staged runtime is the built runtime
        run: |
          set -euo pipefail
          cmp apps/nomos-viewer/dist/nomos_play.wasm \
            target/wasm32-unknown-unknown/wasm/nomos_play.wasm

      - name: Browser smoke lane
        run: |
          node apps/nomos-viewer/smoke/smoke.mjs \
            --dist apps/nomos-viewer/dist \
            --out target/nomos-viewer-smoke \
            --require-chrome

      - name: Upload the screenshots, the receipts, and the recorded session
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nomos-viewer-smoke
          path: |
            target/nomos-viewer-smoke
            target/nomos-viewer-build/receipt.json
          if-no-files-found: error
          retention-days: 90
