name: nomos viewer

# The R1-4 lane, extended by R1-5: the authoritative runtime built for the
# browser, the app's own tests, the staged public artifact, the scan over it, the
# headless Chromium run that plays the six-area route to the final escape, and
# the native replay of the session that run produced. RUNTIME.md section 5 R1-4
# requires this lane to exist and to be green and R1-5 requires the identity
# assertion; no target is accepted while it is red or absent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  r1-adoption-evidence:
    name: R1 offline build, artifact, budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Toolchain provisioning belongs to the runner, not to the repository's
      # dependency closure. Force rustup to resolve the pinned toolchain and
      # wasm target before the proof removes the network route.
      - name: Provision the pinned toolchain
        run: |
          rustup show
          cargo --version

      - name: Measure from a network-isolated clean checkout
        run: |
          set -euo pipefail
          export NOMOS_RUNNER_PATH=$PATH
          export NOMOS_CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}
          export NOMOS_RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}
          export NOMOS_CHROME_BIN=$(command -v google-chrome)
          sudo --preserve-env=NOMOS_RUNNER_PATH,NOMOS_CARGO_HOME,NOMOS_RUSTUP_HOME,NOMOS_CHROME_BIN,RUNNER_ARCH,ImageOS,ImageVersion,GITHUB_WORKSPACE \
            unshare --net -- bash -ceu '
              ip link set lo up
              export PATH=$NOMOS_RUNNER_PATH
              export CARGO_HOME=$NOMOS_CARGO_HOME
              export RUSTUP_HOME=$NOMOS_RUSTUP_HOME
              export CHROME_BIN=$NOMOS_CHROME_BIN
              export GIT_CONFIG_COUNT=1
              export GIT_CONFIG_KEY_0=safe.directory
              export GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE
              export NOMOS_NETWORK_ISOLATED=1
              cd "$GITHUB_WORKSPACE"
              docs/evaluation/r1-adoption-evidence.sh target/r1-adoption
            '

      - name: Upload the complete R1 adoption receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r1-adoption-evidence
          path: target/r1-adoption
          if-no-files-found: error
          retention-days: 90

  viewer:
    name: tests, artifact, scan, browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The smoke harness drives Chrome over Node's global WebSocket, which is
      # stable from Node 22 and absent by default in Node 20. Nothing else in
      # the tree pins a Node, and this lane should not depend on the runner
      # image's default.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Record the environment
        run: |
          node --version
          google-chrome --version
          rustc --version

      # The authoritative runtime, before anything that stages or loads it.
      # `build-wasm.sh` also sweeps the linked module and fails closed on a path
      # from the machine that built it, which is where that check is meaningful.
      - name: Build the play runtime for the browser
        run: crates/nomos-play/build-wasm.sh

      # `nomos-play replay` is what the smoke lane shells to compare the
      # browser's session with the native runtime's.
      - name: Build the native play runtime
        run: cargo build --locked -p nomos-play

      # Runs after the wasm build, because `test/runtime.test.mjs` drives the
      # staged binary and skips with a message when it is absent.
      - name: App tests
        run: node --test apps/nomos-viewer/test/*.test.mjs

      - name: The acceptance grep
        # Recorded rather than asserted here: `test/origins.test.mjs` is the
        # mechanical version, which accounts for every occurrence. This prints
        # what a reader running the acceptance line themselves would see.
        run: |
          set -uo pipefail
          if grep -rn "cdn\.jsdelivr\|unpkg" apps/ --include=*.mjs --include=*.html \
              --exclude-dir=test; then
            echo "an external CDN reference survives outside the tests" >&2
            exit 1
          fi
          echo "every external origin named under apps/ and in this workflow:"
          grep -rn "https\?://" apps/ .github/workflows/nomos-viewer.yml \
            --exclude-dir=vendor || true

      - name: Publish the study's artifacts
        run: experiments/executable-gaol/gaol capture

      - name: Stage and scan the public artifact
        run: |
          node apps/nomos-viewer/build.mjs \
            --from target/executable-gaol \
            --wasm target/wasm32-unknown-unknown/wasm/nomos_play.wasm \
            --out apps/nomos-viewer/dist \
            --receipt target/nomos-viewer-build/receipt.json

      # Two builds, one wiped target directory between them, and the same
      # sha256. RUNTIME.md section 7 records the number this proves.
      - name: The runtime is reproducible
        run: |
          set -euo pipefail
          first=$(sha256sum target/wasm32-unknown-unknown/wasm/nomos_play.wasm | cut -d' ' -f1)
          rm -rf target/wasm32-unknown-unknown
          crates/nomos-play/build-wasm.sh
          second=$(sha256sum target/wasm32-unknown-unknown/wasm/nomos_play.wasm | cut -d' ' -f1)
          echo "build 1 $first"
          echo "build 2 $second"
          test "$first" = "$second"

      # The staged runtime and the one just rebuilt must be the same bytes, or
      # the artifact the browser is about to load is not the one measured.
      - name: The staged runtime is the built runtime
        run: |
          set -euo pipefail
          cmp apps/nomos-viewer/dist/nomos_play.wasm \
            target/wasm32-unknown-unknown/wasm/nomos_play.wasm

      - name: Browser smoke lane
        run: |
          node apps/nomos-viewer/smoke/smoke.mjs \
            --dist apps/nomos-viewer/dist \
            --out target/nomos-viewer-smoke \
            --require-chrome

      - name: Upload the screenshots, the receipts, and the recorded session
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nomos-viewer-smoke
          path: |
            target/nomos-viewer-smoke
            target/nomos-viewer-build/receipt.json
          if-no-files-found: error
          retention-days: 90

  r2-observed-viewer:
    name: R2 offline two-scene proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The packet plants reconstruct the frozen pre-author commit.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Provision the final-proof filesystem isolator
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi
          bwrap --version

      - name: Record the host proof tools
        run: |
          rustc --version
          cargo --version
          node --version
          google-chrome --version

      - name: Build the host packet compiler
        run: cargo build --release --locked -p nomos-observed-scene

      - name: Reconstruct and attack the host-portable packet controls
        run: |
          set -euo pipefail
          frozen=docs/evaluation/r2-second-scene-packet/MANIFEST.sha256
          packet=target/r2-ci-packet
          manifest_digest=$(sha256sum "$frozen" | cut -d ' ' -f 1)
          test "$manifest_digest" = d5708087cf7967a420667c56a7b02ed052b7058ed8545af06e6771170003c948

          docs/evaluation/r2-second-scene-packet/assemble.sh \
            f64d374ee001ef0e51b66e3b2b4078ad6d1d770e \
            target/release/nomos-observed-scene \
            "$packet"

          # The released ELF is bound to the reference-host linker. Compare
          # every portable packet row exactly and record the hosted binary.
          grep -v '  bin/nomos-observed-scene$' "$frozen" >target/r2-frozen-portable.sha256
          grep -v '  bin/nomos-observed-scene$' "$packet/MANIFEST.sha256" >target/r2-host-portable.sha256
          cmp target/r2-frozen-portable.sha256 target/r2-host-portable.sha256
          sha256sum target/release/nomos-observed-scene

          cp -a "$packet" target/r2-ci-packet-drift
          printf '\n' >>target/r2-ci-packet-drift/R2.md
          if docs/evaluation/r2-second-scene-packet/verify.sh target/r2-ci-packet-drift >/dev/null 2>&1; then
            exit 1
          fi
          cp -a "$packet" target/r2-ci-packet-extra
          printf 'extra\n' >target/r2-ci-packet-extra/extra.txt
          if docs/evaluation/r2-second-scene-packet/verify.sh target/r2-ci-packet-extra >/dev/null 2>&1; then
            exit 1
          fi

          cp --parents \
            fixtures/r2/scenes/scene_two.json \
            fixtures/r2/plans/scene_two.json \
            docs/evaluation/runs/r2/2026-08-27-issue-197-second-author/BROWSER_RECEIPT.json \
            docs/evaluation/runs/r2/2026-08-27-issue-197-second-author/SCENE_SIGNATURES.json \
            docs/evaluation/runs/r2/2026-08-27-issue-197-second-author/SECOND_AUTHOR_RECEIPT.md \
            docs/evaluation/runs/r2/2026-08-27-issue-197-second-author/evidence/contact-sheet.png \
            docs/evaluation/runs/r2/2026-08-27-issue-197-second-author/evidence/scene_1.png \
            docs/evaluation/runs/r2/2026-08-27-issue-197-second-author/evidence/scene_2.png \
            "$packet"
          docs/evaluation/r2-second-scene-packet/audit-author-output.sh "$packet"

      - name: Reproduce both compiler plans
        run: |
          set -euo pipefail
          target/release/nomos-observed-scene compile \
            --input fixtures/r2/scenes/scene_one.json \
            --out target/r2-ci-scene-one.json
          target/release/nomos-observed-scene compile \
            --input fixtures/r2/scenes/scene_two.json \
            --out target/r2-ci-scene-two.json
          cmp fixtures/r2/plans/scene_one.json target/r2-ci-scene-one.json
          cmp fixtures/r2/plans/scene_two.json target/r2-ci-scene-two.json

      - name: R2 registers, plants, signatures, and Node tests
        run: |
          set -euo pipefail
          docs/evaluation/r2-schema-ownership.sh
          docs/evaluation/r2-source-provenance.sh
          docs/evaluation/r2-source-provenance.test.sh
          docs/evaluation/r2-adopter-neutrality.sh
          docs/evaluation/r2-adopter-neutrality.test.sh
          docs/evaluation/r2-complete-proof.test.sh
          node docs/evaluation/r2-maximum.test.mjs
          node docs/evaluation/r2-scene-signature.mjs \
            fixtures/r2/scenes/scene_one.json \
            fixtures/r2/scenes/scene_two.json >target/r2-ci-signatures.json
          node --test \
            apps/nomos-observed-viewer/test/*.test.mjs \
            docs/evaluation/r2-scene-signature.test.mjs \
            docs/evaluation/r2-complete-proof-process.test.mjs \
            docs/evaluation/r2-complete-proof-receipt.test.mjs

      - name: Build and scan the two-scene artifact
        run: |
          node apps/nomos-observed-viewer/build.mjs \
            --plan fixtures/r2/plans/scene_one.json \
            --plan fixtures/r2/plans/scene_two.json \
            --out target/r2-observed-dist \
            --receipt target/r2-observed-build.json

      - name: Ten fresh browser profiles per scene
        run: |
          CHROME_BIN=$(command -v google-chrome) \
            node apps/nomos-observed-viewer/smoke/smoke.mjs \
              --dist target/r2-observed-dist \
              --out target/r2-observed-smoke \
              --samples 10

      - name: Upload R2 build, timing, and frame evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r2-observed-viewer-proof
          path: |
            target/r2-ci-signatures.json
            target/r2-observed-build.json
            target/r2-observed-smoke
          if-no-files-found: error
          retention-days: 90

  r2-complete-proof:
    name: R2 detached complete proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Provision host tools before isolation
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap
          fi
          bwrap --version
          google-chrome --version

      - name: Run the detached complete proof
        run: |
          set -euo pipefail
          candidate=$(git rev-parse 'HEAD^{commit}')
          git checkout --detach "$candidate"
          test "$(git rev-parse --is-shallow-repository)" = false
          mkdir -p target/r2-complete-proof
          CHROME_BIN=$(command -v google-chrome) \
            docs/evaluation/r2-complete-proof.sh \
              --output target/r2-complete-proof

      - name: Upload the bound complete-proof evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r2-complete-proof
          path: target/r2-complete-proof
          if-no-files-found: error
          retention-days: 90
