name: executable gaol pages

on:
  push:
    branches:
      - main
      - "experiment/issue-*-executable-gaol"
    paths:
      - ".github/workflows/executable-gaol-pages.yml"
      - "experiments/executable-gaol/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: executable-gaol-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build and verify the public demo
        run: |
          experiments/executable-gaol/gaol verify
          experiments/executable-gaol/gaol site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the static demo
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/executable-gaol-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    steps:
      - name: Publish the demo
        id: deployment
        uses: actions/deploy-pages@v5
