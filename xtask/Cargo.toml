[package]
name = "xtask"
description = "Workspace tooling: the KERNEL.md section 10 dependency-boundary check."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# xtask deliberately depends on nothing: not on crates.io, and not on any
# kernel crate. The boundary checker must not appear inside the dependency
# graph it is checking, or its own dependencies would need carve-outs in the
# forbidden list. `cargo xtask boundary` proves this crate stays outside.
[dependencies]
