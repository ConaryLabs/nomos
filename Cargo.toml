[workspace]
resolver = "3"
members = [
    "crates/estate-core",
    "crates/estate-schema",
    "crates/estate-projection",
    "crates/estate-compiler",
    "crates/estate-sim",
    "crates/estate-cli",
    "xtask",
]

# Metadata shared by every member. `xtask` is workspace tooling, not a Gate K
# kernel crate; the boundary checker in `xtask` enforces that distinction.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/ConaryLabs/signed-world"
publish = false

# The only permitted dependency edges are the ones in KERNEL.md section 10.
# They are declared once here so a member cannot invent a path dependency
# quietly, and `cargo xtask boundary` proves the resolved graph matches.
[workspace.dependencies]
estate-core = { path = "crates/estate-core" }
estate-schema = { path = "crates/estate-schema" }
estate-projection = { path = "crates/estate-projection" }
estate-compiler = { path = "crates/estate-compiler" }
estate-sim = { path = "crates/estate-sim" }

# Lean build profile: KERNEL.md acceptance 16 measures peak disk, so debug
# builds carry line tables only instead of full DWARF.
[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = false
