[workspace]
resolver = "3"
members = [
    "crates/nomos-core",
    "crates/nomos-schema",
    "crates/nomos-projection",
    "crates/nomos-compiler",
    "crates/nomos-sim",
    "crates/nomos-cli",
    "crates/nomos-play",
    "crates/nomos-render-plan",
    "crates/nomos-observed-scene",
    "xtask",
]

# Metadata shared by every member. `xtask` is workspace tooling, not a Gate K
# kernel crate; the boundary checker in `xtask` enforces that distinction.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/ConaryLabs/nomos"
publish = false

# The only permitted dependency edges are the ones in KERNEL.md section 10.
# They are declared once here so a member cannot invent a path dependency
# quietly, and `cargo xtask boundary` proves the resolved graph matches.
[workspace.dependencies]
nomos-core = { path = "crates/nomos-core" }
nomos-schema = { path = "crates/nomos-schema" }
nomos-projection = { path = "crates/nomos-projection" }
nomos-compiler = { path = "crates/nomos-compiler" }
nomos-sim = { path = "crates/nomos-sim" }

# RUNTIME.md section 3: declared R1 members. An R1 crate may depend on any
# kernel crate and on another declared R1 crate while the graph stays acyclic.
nomos-play = { path = "crates/nomos-play" }
nomos-render-plan = { path = "crates/nomos-render-plan" }

# R2.md revision 1 section 4: the isolated observed-scene carrier/compiler.
nomos-observed-scene = { path = "crates/nomos-observed-scene" }

# Lean build profile: KERNEL.md acceptance 16 measures peak disk, so debug
# builds carry line tables only instead of full DWARF.
[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = false

# The wasm32 build of nomos-play (RUNTIME.md section 5 R1-5). A separate profile
# rather than settings on [profile.release], because Cargo profiles are
# workspace-global and lto, panic, and strip have no per-package override:
# putting them on the release profile would change every native release build in
# the workspace, including giving native binaries panic = "abort". Nothing
# selects this profile except the wasm build, and no Gate K command uses it.
#
# Measured on the R1-5 branch: 211 650 bytes here against 554 732 with the plain
# release profile. panic = "abort" buys no bytes on wasm32-unknown-unknown,
# whose std is built without unwinding; it is declared so the intent is written
# down rather than inferred.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
