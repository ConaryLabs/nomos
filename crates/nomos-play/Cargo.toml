[package]
name = "nomos-play"
description = "R1 authoritative play runtime: actors, command batches, pursuit, receipts, and replay over the kernel's transactions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# RUNTIME.md section 3: an R1 crate may depend on any kernel crate. This one
# needs three. It deliberately does not depend on nomos-schema or
# nomos-compiler in the built library: both would put Canonical World IR and
# compiler receipts inside its reach, which section 3 forbids by name.
#
# RUNTIME.md section 4: zero third-party dependencies. Nothing is recorded in
# section 4's addition table by this crate. The wasm32 build links the pinned
# toolchain's own `std`, whose allocator is `dlmalloc`; that is the standard
# library, not a Cargo dependency, and `cargo tree` shows the three edges below
# and nothing else.
[dependencies]
nomos-core.workspace = true
nomos-projection.workspace = true
nomos-sim.workspace = true

# Dev-only. `tests/semantics.rs` compiles the four committed area sources in
# memory and asserts that the simulation projection this crate decodes is the
# value the compiler projected. Neither edge exists in the built library;
# `cargo xtask boundary` counts dev-dependency edges, and both targets are
# kernel crates, which RUNTIME.md section 3 permits.
[dev-dependencies]
nomos-compiler.workspace = true
nomos-schema.workspace = true

[lib]
name = "nomos_play"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nomos-play"
path = "src/bin/nomos-play.rs"
