[package]
name = "estate-cli"
description = "The estate command-line surface and artifact orchestration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# KERNEL.md section 10:
# estate-cli -> estate-core, estate-compiler, estate-sim, estate-projection.
# estate-schema is deliberately absent: the CLI orchestrates artifacts, it does
# not read authoring schemas directly.
[dependencies]
estate-core.workspace = true
estate-compiler.workspace = true
estate-projection.workspace = true
estate-sim.workspace = true

[[bin]]
name = "estate"
path = "src/main.rs"
